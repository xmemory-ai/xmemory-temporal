name: publish

# Publishes xmemory-temporal to PyPI. Start it from the Actions tab: publish → Run
# workflow, on `main`. The version comes from pyproject.toml, so bump it (and
# uv.lock) in a PR first. Once PyPI has the files, the commit is tagged
# v<version> and a GitHub Release is created with generated notes.
on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: a second run queues instead of racing the first to the tag.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Everything that runs repository code runs here, with no id-token and no
  # publishing credentials: a compromised dependency or test cannot reach either.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          # Without this the action installs whatever uv is newest, so two runs of
          # the same commit can build with different tooling.
          version: "0.9.13"
      - name: Check the run is on main
        # "Run workflow" accepts any branch or tag, and only main is released.
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "refusing to publish from $GITHUB_REF: run this workflow on main"; exit 1; }
      - name: Read the version
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the version is not released yet
        # PyPI accepts a version only once, so stop now rather than after the
        # deployment is approved.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tagged="$(git ls-remote --tags origin "refs/tags/v$VERSION")"
          test -z "$tagged" || { echo "v$VERSION is already tagged: bump the version first"; exit 1; }
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/xmemory-temporal/$VERSION/json")"
          test "$status" = 404 || {
            echo "PyPI answered $status for xmemory-temporal $VERSION, not 404: already published, or PyPI is unreachable"; exit 1; }
      - name: Install (locked)
        # --locked, or a drifted lockfile would silently resolve to versions the
        # release was never tested against.
        run: uv sync --dev --locked
      - name: Lint + format check
        run: |
          uv run ruff check src tests examples
          uv run ruff format --check src tests examples
      - name: Type check
        run: uv run pyright src tests examples
      - name: Test
        run: uv run pytest
      - name: Build sdist + wheel
        run: uv build
      - name: Check the built distributions
        # --strict, so a metadata warning fails the release instead of scrolling
        # past. twine says nothing about file contents, so the license files are
        # asserted separately: their absence is only visible once published.
        #
        # Inspected in Python, not `tar -tzf | grep -q`: grep exits on its first
        # match, tar takes SIGPIPE, and under the `pipefail` this shell runs with
        # the pipeline fails — reporting the file missing when it is present.
        run: |
          uv run --no-project --with "twine==6.2.0" --with "packaging==25.0" --with "readme-renderer==45.0" \
            twine check --strict dist/*
          uv run --no-project python - <<'PY'
          import glob, sys, tarfile, zipfile

          required = ("LICENSE", "NOTICE")
          sdist = glob.glob("dist/*.tar.gz")[0]
          wheel = glob.glob("dist/*.whl")[0]
          names = tarfile.open(sdist).getnames()
          missing = [f for f in required if not any(n.endswith(f"/{f}") for n in names)]
          if missing:
              sys.exit(f"{', '.join(missing)} missing from {sdist}")
          names = zipfile.ZipFile(wheel).namelist()
          missing = [f for f in required if f"licenses/{f}" not in " ".join(names)]
          if missing:
              sys.exit(f"{', '.join(missing)} missing from {wheel}")
          print("LICENSE and NOTICE present in both artifacts")
          PY
      - name: Upload the artifacts for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Nothing from the repository executes here: it only downloads the artifacts the
  # job above already verified and hands them to PyPI. That keeps the OIDC token
  # and the publishing credential away from build and test code.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Needs a reviewer's approval. PyPI's trusted publisher names this environment,
    # this repository and this workflow file, so renaming any of them breaks publishing.
    environment: pypi
    permissions:
      contents: read
      id-token: write # Trusted Publishing + PEP 740 attestations (provenance)
    steps:
      - name: Download the verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # Trusted Publishing, so no token is stored. Do not add a `password:`: the
        # action would use it instead and stop producing attestations.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Runs only after PyPI has the files, so a failed upload leaves no tag behind. If
  # this job alone fails, use "Re-run failed jobs": a new run stops at the
  # not-released check, because PyPI already has the version.
  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
